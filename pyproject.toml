[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturenotes"
version = "0.1.0"
description = "Turn a lecture video into an illustrated study note: slides, transcript and explanations on one page."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # mediapipe depends on the contrib build; installing opencv-python-headless next to it breaks cv2.
    "opencv-contrib-python",
    "av",
    "faster-whisper",
    "jinja2",
    "markdown",
    "mediapipe",
]

[project.optional-dependencies]
gemini = ["google-genai"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
test = ["pytest"]

[project.scripts]
lecturenotes = "lecturenotes.cli:main"

[tool.setuptools.packages.find]
include = ["lecturenotes*"]

[tool.setuptools.package-data]
lecturenotes = ["templates/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
